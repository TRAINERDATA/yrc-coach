name: daily-brief

# 서버 깨우기 전용 (예약 실행이 1~3시간 늦게 돌아서 브리핑 전송에는 쓰지 않는다. 전송은 폰 단축어가 업로드 직후 호출)
# cron 은 UTC. 07:30/21:50 KST 무렵에 한 번씩 미리 깨워 두는 용도이며, 늦게 돌아도 해가 없다.
on:
  schedule:
    - cron: "30 22 * * *"
    - cron: "50 12 * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: https://yrc-coach.onrender.com
    steps:
      - name: Wake server (retry until healthy)
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -m 90 -o /dev/null -w "%{http_code}" "$BASE/health" || true)
            echo "try $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "server did not wake"; exit 1
