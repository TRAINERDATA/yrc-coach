name: daily-brief

# 매일 아침 (KST) 서버를 깨우고 브리핑을 보낸다. cron 은 UTC 기준 (KST-9).
#   23:00 UTC = 08:00 KST 깨우기 · 23:25 UTC = 08:25 KST 브리핑
on:
  schedule:
    - cron: "0 23 * * *"
    - cron: "25 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "wake | brief"
        default: "brief"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: https://yrc-coach.onrender.com
      TOKENS: ${{ vars.BRIEF_TOKENS || 'xlrAjA7X0A_OPm2OBakS8tof' }}
    steps:
      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 23 * * *" ]; then echo "mode=wake" >> $GITHUB_OUTPUT
          else echo "mode=brief" >> $GITHUB_OUTPUT; fi

      - name: Wake server (retry until healthy)
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -m 90 -o /dev/null -w "%{http_code}" "$BASE/health" || true)
            echo "try $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "server did not wake"; exit 1

      - name: Send briefings
        if: steps.mode.outputs.mode == 'brief'
        run: |
          fail=0
          for t in $(echo "$TOKENS" | tr ',' ' '); do
            ok=0
            for i in 1 2 3; do
              out=$(curl -s -m 170 -X POST "$BASE/brief/$t/run" || true)
              echo "[$t] try $i: $(echo "$out" | head -c 200)"
              if echo "$out" | grep -q '"delivered":true'; then ok=1; break; fi
              sleep 30
            done
            [ $ok = 1 ] || fail=1
          done
          exit $fail
